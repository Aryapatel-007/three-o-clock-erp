# MongoDB Community on the cafe box. P62 section 2.1 and section 10.
#
# A single-node REPLICA SET, never a standalone: bills are numbered inside a
# transaction, and a standalone cannot run one, so every bill would fail at
# the till. The server refuses to start against a standalone.
#
# install-ubuntu.sh copies this to /etc/mongod.conf and fills in LAN_IP.

storage:
  dbPath: /var/lib/mongodb
  # Journaling is always on in WiredTiger; a power cut loses no acknowledged write.

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # The box itself and the LAN only. NEVER 0.0.0.0, never forwarded on the router.
  bindIp: 127.0.0.1,LAN_IP

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

replication:
  replSetName: rs0
  # Seven days of a busy restaurant's writes, at least: the shipper and the
  # change stream can resume after a week of dead 4G (docs/REPLICATION.md section 3.4).
  oplogSizeMB: 20480

security:
  authorization: enabled
  # A replica set with authorization needs a key file, even with one member.
  keyFile: /etc/mongodb/keyfile
