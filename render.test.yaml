# The TEST site on Render, as a Blueprint. P48 Part I, 2026-10-14.
#
# One service serves both the API and the screens (the Dockerfile builds the
# client and the server serves it), at its own address, on its own database:
# three-o-clock-erp-test on the same Atlas cluster. Staff practise here; nothing
# touches a real bill or a real invoice number.
#
# Create it in Render with New, Blueprint, this repository, and Blueprint path
# render.test.yaml. Render generates the secrets; it asks for MONGO_URI, which
# must end in /three-o-clock-erp-test, never the live database. docs/DEPLOYMENT.md
# section 16.
services:
  - type: web
    name: three-o-clock-erp-test
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The screens are served by this same service, so the app's own address.
      - key: CLIENT_ORIGIN
        value: https://three-o-clock-erp-test.onrender.com
      # Only Render's proxy in front: no Vercel here.
      - key: TRUST_PROXY
        value: '1'
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTEGRATION_SECRETS_KEY
        generateValue: true
      - key: PAYMENT_SECRETS_KEY
        generateValue: true
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
