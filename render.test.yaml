# The TEST site on Render, as a Blueprint. P48 Part I, 2026-10-14.
#
# One service serves both the API and the screens (the Dockerfile builds the
# client and the server serves it), at its own address, on its own database:
# restaurant-erp-test on the same Atlas cluster. Staff practise here; nothing
# touches a real bill or a real invoice number.
#
# Create it in Render with New, Blueprint, this repository, and Blueprint path
# render.test.yaml. Render generates the secrets; it asks for MONGO_URI, which
# must end in /restaurant-erp-test, never /restaurant-erp. docs/DEPLOYMENT.md
# section 16.
#
# P63: this test service is also the website half of two-way sync. SYNC_MODE is
# TWO_WAY; REPLICATION_SECRET is asked for, and the same value goes in the cafe
# PC's .env with SYNC_MODE=TWO_WAY and MIRROR_URL=https://zchaat-pos-test.onrender.com.
# docs/DEPLOYMENT.md section 19.
services:
  - type: web
    name: zchaat-pos-test
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The screens are served by this same service, so the app's own address.
      - key: CLIENT_ORIGIN
        value: https://zchaat-pos-test.onrender.com
      # Only Render's proxy in front: no Vercel here.
      - key: TRUST_PROXY
        value: '1'
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTEGRATION_SECRETS_KEY
        generateValue: true
      - key: PAYMENT_SECRETS_KEY
        generateValue: true
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      # P63. The website and the cafe PC both take bills, kept in step by the PC.
      - key: SYNC_MODE
        value: TWO_WAY
      - key: REPLICATION_SECRET
        sync: false
