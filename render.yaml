# The API server on Render, as a Blueprint. 2026-10-09, at Rishi's request:
# Render's free plan for the server, Vercel for the screens. docs/DEPLOYMENT.md
# section 14 says how, and what the free plan costs in waiting.
#
# Create it in Render with New, Blueprint, this repository. Render generates
# the secrets marked generateValue; it asks for MONGO_URI, which is never in git.
services:
  - type: web
    name: three-o-clock-erp-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The screens' address on Vercel. Vercel forwards /api here, so to the
      # browser the app and the API are one address (client/vercel.json).
      - key: CLIENT_ORIGIN
        value: https://three-o-clock-erp.vercel.app
      # Vercel's edge, then Render's proxy: two in front of the server.
      - key: TRUST_PROXY
        value: '2'
      - key: MONGO_URI
        sync: false
      # Render's generated values are 32 random bytes in base64: long enough for
      # the JWT secrets, and exactly what the two encryption keys need.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTEGRATION_SECRETS_KEY
        generateValue: true
      - key: PAYMENT_SECRETS_KEY
        generateValue: true
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      # P44. The day-end email. The key is a secret, set in Render's dashboard.
      - key: RESEND_API_KEY
        sync: false
      # P54. Backups to Backblaze B2 (docs/DEPLOYMENT.md section 8). Every value is
      # typed into Render's dashboard by hand, never written in a file. BACKUP_ENABLED
      # stays off until the rest are set: with on, the server refuses to start without them.
      - key: BACKUP_ENABLED
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_OLD_KEYS
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
